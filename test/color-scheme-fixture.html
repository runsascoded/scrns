<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>scrns color-scheme test fixture</title>
  <style>
    /* Background set only by `prefers-color-scheme` media queries (white if neither matched) */
    body { margin: 0; background: rgb(255, 255, 255); }
    @media (prefers-color-scheme: light) { body { background: rgb(0, 0, 255); } }
    @media (prefers-color-scheme: dark) { body { background: rgb(0, 0, 0); } }
  </style>
</head>
<body></body>
</html>
